<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tl-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Electric Cyan to Purple Neon Gradient -->
    <linearGradient id="tl-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Subtle Glow for High Visibility in Tabs -->
    <filter id="tl-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#00f2fe" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base (Ensures crisp contrast on both Dark & Light browser tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tl-bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Concentric Accuracy Ring -->
  <circle cx="28" cy="27" r="18" stroke="url(#tl-grad)" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Optical Verification Lens -->
  <circle cx="28" cy="27" r="13.5" stroke="url(#tl-grad)" stroke-width="3.5" stroke-linecap="round" filter="url(#tl-glow)"/>

  <!-- Ergonomic Lens Handle -->
  <path d="M38 37L51 50" stroke="url(#tl-grad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Verified Checkmark -->
  <path d="M22 27.5L26.5 32L34.5 21.5" stroke="url(#tl-grad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Pointed AI Truth Sparkle Star -->
  <path d="M28 14 C28 17 29.5 18.5 32.5 18.5 C29.5 18.5 28 20 28 23 C28 20 26.5 18.5 23.5 18.5 C26.5 18.5 28 17 28 14 Z" fill="#00f2fe"/>
</svg>