<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Electric Cyan to Purple Neon Gradient -->
    <linearGradient id="tl-grad" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glowing Drop Shadow for maximum contrast -->
    <filter id="tl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f2fe" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Big Bold Optical Verification Lens (Maximized to fill the canvas) -->
  <circle cx="28" cy="27" r="21" stroke="url(#tl-grad)" stroke-width="5" stroke-linecap="round" filter="url(#tl-glow)"/>

  <!-- Thick High-Visibility Lens Handle -->
  <path d="M43 42L58 57" stroke="url(#tl-grad)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Crisp Verified Checkmark -->
  <path d="M19 28L26 35L38 19" stroke="url(#tl-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-Pointed AI Truth Sparkle Star -->
  <path d="M28 6 C28 10 30 12 34 12 C30 12 28 14 28 18 C28 14 26 12 22 12 C26 12 28 10 28 6 Z" fill="#00f2fe"/>
</svg>